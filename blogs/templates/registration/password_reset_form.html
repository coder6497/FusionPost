{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Забыли пароль{% endblock %}

{% block body %}
    <h1>Забыли пароль</h1>
    <br>
    <p>Вставьте свой e-mail для сброса пароля.</p>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <input class="btn btn-success" type="submit" value="Отправить">
    </form>
{% endblock %}
